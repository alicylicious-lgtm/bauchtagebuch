<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Bauchtagebuch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E7D74">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bauchtagebuch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#F3F7F6; --card:#FFFFFF; --ink:#1E3A3A; --muted:#6B8584;
    --line:#E2EBEA; --accent:#2E7D74;
    --c-essen:#D98E22; --c-erbrechen:#D9534A; --c-stuhl:#8B6F4E;
    --c-pflege:#7C6FB0; --c-symptom:#4E8FA8;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.45; padding-bottom:120px;}
  .wrap{max-width:560px; margin:0 auto; padding:0 14px;}

  header{padding:22px 0 8px;}
  header h1{font-size:24px; font-weight:800; margin:0; letter-spacing:-0.3px;}
  header .sub{color:var(--muted); font-size:13.5px; margin-top:2px;}
  .headrow{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .iconbtn{background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:9px 12px; font-size:17px; cursor:pointer; line-height:1;}

  /* Quick add */
  .quick{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:14px 0 6px;}
  .quick button{border:none; border-radius:14px; padding:12px 4px 10px; cursor:pointer;
    background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-family:inherit; font-weight:700; font-size:11.5px; color:var(--ink);
    box-shadow:0 1px 2px rgba(30,58,58,.05); transition:transform .08s;}
  .quick button:active{transform:scale(.95);}
  .quick .emo{font-size:21px;}
  .quick button span.lbl{white-space:nowrap;}
  .quick button[data-t="essen"]{border-bottom:3px solid var(--c-essen);}
  .quick button[data-t="erbrechen"]{border-bottom:3px solid var(--c-erbrechen);}
  .quick button[data-t="stuhl"]{border-bottom:3px solid var(--c-stuhl);}
  .quick button[data-t="pflege"]{border-bottom:3px solid var(--c-pflege);}
  .quick button[data-t="symptom"]{border-bottom:3px solid var(--c-symptom);}

  /* Timeline */
  .day{margin-top:22px;}
  .dayhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    padding:0 2px 8px;}
  .dayhead h2{font-size:15px; font-weight:800; margin:0;}
  .daybadges{display:flex; gap:6px;}
  .badge{font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px;
    background:#FBEBEA; color:var(--c-erbrechen);}
  .timeline{position:relative; padding-left:26px;}
  .timeline::before{content:""; position:absolute; left:9px; top:6px; bottom:6px;
    width:2px; background:var(--line); border-radius:2px;}
  .entry{position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:11px 13px; margin-bottom:9px; cursor:pointer;}
  .entry::before{content:""; position:absolute; left:-23px; top:17px; width:12px; height:12px;
    border-radius:50%; background:var(--dot,#999); border:2.5px solid var(--bg);}
  .entry .top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .entry .kind{font-weight:800; font-size:13.5px; color:var(--dot);}
  .entry .time{font-size:12.5px; color:var(--muted); font-weight:700; flex-shrink:0;}
  .entry .body{font-size:14.5px; margin-top:2px; white-space:pre-wrap; word-break:break-word;}
  .entry .note{font-size:13px; color:var(--muted); margin-top:2px; white-space:pre-wrap;}

  .empty{text-align:center; color:var(--muted); padding:48px 20px; font-size:14.5px;}
  .empty .emo{font-size:36px; display:block; margin-bottom:8px;}

  /* Bottom bar */
  .bottombar{position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent, var(--bg) 35%);
    padding:18px 14px 16px; display:flex; justify-content:center;}
  .bottombar .inner{max-width:560px; width:100%; display:flex; gap:10px;}
  .btn{font-family:inherit; font-weight:800; font-size:15px; border:none; border-radius:14px;
    padding:14px 18px; cursor:pointer;}
  .btn.primary{background:var(--accent); color:#fff; flex:1;
    box-shadow:0 4px 14px rgba(46,125,116,.35);}
  .btn.ghost{background:var(--card); border:1px solid var(--line); color:var(--ink);}

  /* Sheet / modal */
  .overlay{position:fixed; inset:0; background:rgba(20,40,40,.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;}
  .overlay.open{display:flex;}
  .sheet{background:var(--card); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    border-radius:22px 22px 0 0; padding:18px 18px 26px; animation:up .18s ease-out;}
  @keyframes up{from{transform:translateY(40px); opacity:.5;} to{transform:none; opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none;} }
  .sheet h3{margin:0 0 14px; font-size:18px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; font-weight:800; color:var(--muted);
    margin-bottom:5px; text-transform:uppercase; letter-spacing:.4px;}
  input[type=text], input[type=datetime-local], input[type=date], textarea, select{
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 12px;}
  textarea{resize:vertical; min-height:64px;}
  input:focus, textarea:focus, select:focus, button:focus-visible{outline:2.5px solid var(--accent); outline-offset:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chip{font-family:inherit; font-size:13.5px; font-weight:700; padding:7px 12px; border-radius:99px;
    background:var(--bg); border:1.5px solid var(--line); color:var(--ink); cursor:pointer;}
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .sheetbtns{display:flex; gap:10px; margin-top:18px;}
  .sheetbtns .btn{flex:1;}
  .btn.danger{background:#FBEBEA; color:var(--c-erbrechen);}
  .hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .savednote{position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; font-weight:700; font-size:14px;
    padding:9px 18px; border-radius:99px; z-index:99; display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="headrow">
      <div>
        <h1>🧸 Bauchtagebuch</h1>
        <div class="sub" id="subline">Ernährungs- &amp; Symptomprotokoll</div>
      </div>
      <button class="iconbtn" id="settingsBtn" title="Einstellungen" aria-label="Einstellungen">⚙️</button>
    </div>
  </header>

  <div class="quick">
    <button data-t="essen" onclick="openForm('essen')"><span class="emo">🍽️</span><span class="lbl">Essen</span></button>
    <button data-t="erbrechen" onclick="openForm('erbrechen')"><span class="emo">🤢</span><span class="lbl">Erbrochen</span></button>
    <button data-t="stuhl" onclick="openForm('stuhl')"><span class="emo">💩</span><span class="lbl">Stuhlgang</span></button>
    <button data-t="pflege" onclick="openForm('pflege')"><span class="emo">🧴</span><span class="lbl">Pflege</span></button>
    <button data-t="symptom" onclick="openForm('symptom')"><span class="emo">📝</span><span class="lbl">Symptom</span></button>
  </div>

  <div id="list"></div>
</div>

<div class="bottombar">
  <div class="inner">
    <button class="btn primary" onclick="openExport()">📄 Als PDF für den Arzt exportieren</button>
  </div>
</div>

<!-- Eintrag-Formular -->
<div class="overlay" id="formOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3 id="formTitle"></h3>
    <div class="field">
      <label for="fTime">Datum &amp; Uhrzeit</label>
      <input type="datetime-local" id="fTime">
    </div>
    <div class="field" id="chipField">
      <label id="chipLabel"></label>
      <div class="chips" id="chipBox"></div>
    </div>
    <div class="field">
      <label id="mainLabel" for="fMain"></label>
      <textarea id="fMain" rows="2"></textarea>
      <div class="hint" id="mainHint"></div>
    </div>
    <div class="field">
      <label for="fNote">Zusätzliche Notiz (optional)</label>
      <textarea id="fNote" rows="2" placeholder="z. B. Verhalten, Besonderheiten …"></textarea>
    </div>
    <div class="sheetbtns">
      <button class="btn danger" id="deleteBtn" style="display:none" onclick="deleteEntry()">Löschen</button>
      <button class="btn ghost" onclick="closeForm()">Abbrechen</button>
      <button class="btn primary" onclick="saveEntry()">Speichern</button>
    </div>
  </div>
</div>

<!-- Export -->
<div class="overlay" id="exportOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>📄 PDF-Export</h3>
    <div class="field">
      <label>Zeitraum</label>
      <div class="chips" id="rangeChips">
        <button class="chip on" data-d="7">Letzte 7 Tage</button>
        <button class="chip" data-d="14">Letzte 14 Tage</button>
        <button class="chip" data-d="30">Letzte 30 Tage</button>
        <button class="chip" data-d="0">Alles</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="expFrom">Von</label><input type="date" id="expFrom"></div>
      <div class="field"><label for="expTo">Bis</label><input type="date" id="expTo"></div>
    </div>
    <div class="hint">Das PDF enthält eine Zusammenfassung (Anzahl der Erbrechens-Episoden) und alle Einträge chronologisch nach Tagen gruppiert – zur Vorlage beim Gastroenterologen.</div>
    <div class="sheetbtns">
      <button class="btn ghost" onclick="closeOverlay('exportOverlay')">Abbrechen</button>
      <button class="btn primary" onclick="makePDF()">PDF erstellen</button>
    </div>
  </div>
</div>

<!-- Einstellungen -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>⚙️ Einstellungen</h3>
    <div class="field"><label for="sName">Name des Kindes</label><input type="text" id="sName" placeholder="z. B. Mia"></div>
    <div class="field"><label for="sBirth">Geburtsdatum (für das PDF)</label><input type="date" id="sBirth"></div>
    <div class="field"><label for="sExtra">Bekannte Befunde / Hinweis für den Arzt</label>
      <textarea id="sExtra" rows="2" placeholder="z. B. Sonografie: Meteorismus (geblähtes Abdomen), sonst o. B."></textarea></div>
    <div class="sheetbtns">
      <button class="btn ghost" onclick="closeOverlay('settingsOverlay')">Abbrechen</button>
      <button class="btn primary" onclick="saveSettings()">Speichern</button>
    </div>
  </div>
</div>

<div class="savednote" id="toast">Gespeichert ✓</div>

<script>
const TYPES = {
  essen:    {label:"Essen / Trinken", emo:"🍽️", color:"#D98E22",
             chipLabel:"Mahlzeit", chips:["Frühstück","Mittagessen","Abendessen","Snack","Getränk","Flasche/Milch"],
             mainLabel:"Was wurde gegessen / getrunken?", hint:"z. B. Banane, Vollkornbrot mit Butter, 150 ml Wasser", multiChip:false},
  erbrechen:{label:"Erbrechen", emo:"🤢", color:"#D9534A",
             chipLabel:"Beschreibung", chips:["direkt nach dem Essen","später nach dem Essen","nüchtern","schwallartig","würgen/spucken","wenig","viel"],
             mainLabel:"Beschreibung (Menge, Aussehen, Auslöser?)", hint:"z. B. ca. 30 min nach dem Mittagessen, unverdaute Reste", multiChip:true},
  stuhl:    {label:"Stuhlgang", emo:"💩", color:"#8B6F4E",
             chipLabel:"Konsistenz", chips:["fest","normal","weich","breiig","flüssig","schleimig","auffällige Farbe"],
             mainLabel:"Auffälligkeiten (optional)", hint:"z. B. übel riechend, unverdaute Stücke", multiChip:true},
  pflege:   {label:"Pflegeprodukt / Kosmetik", emo:"🧴", color:"#7C6FB0",
             chipLabel:"Art", chips:["Creme","Sonnencreme","Badezusatz","Shampoo","Zahnpasta","Öl","Feuchttücher","Neu eingesetzt"],
             mainLabel:"Produktname & Anwendungsbereich", hint:"z. B. Weleda Calendula-Creme, Gesicht & Hände", multiChip:true},
  symptom:  {label:"Symptom / Notiz", emo:"📝", color:"#4E8FA8",
             chipLabel:"Symptom", chips:["Blähbauch","Bauchschmerzen","Pupsen","unruhiger Schlaf","quengelig","Fieber","Appetitlosigkeit"],
             mainLabel:"Beschreibung", hint:"z. B. Bauch sichtbar gebläht am Abend, zieht Beine an", multiChip:true}
};

let DATA = {settings:{name:"Bruce",birth:"",extra:""}, entries:[]};

let editId = null, curType = null, selChips = [];
const KEY = "bauchtagebuch:data";

async function load(){
  try{
    if(typeof localStorage !== "undefined" && localStorage.getItem(KEY)){
      DATA = JSON.parse(localStorage.getItem(KEY));
    } else if(window.storage){
      const r = await window.storage.get(KEY);
      if(r && r.value) DATA = JSON.parse(r.value);
    }
  }catch(e){ /* noch keine Daten vorhanden */ }
  if(!DATA.settings.name) DATA.settings.name = "Bruce";
  render();
}
async function persist(){
  const json = JSON.stringify(DATA);
  try{
    if(typeof localStorage !== "undefined"){ localStorage.setItem(KEY, json); return; }
  }catch(e){ /* localStorage nicht verfügbar, z. B. in der Claude-Vorschau */ }
  try{ if(window.storage) await window.storage.set(KEY, json); }
  catch(e){ console.error("Speichern fehlgeschlagen", e); }
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(()=>t.style.display="none", 1600);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,"0"); }
function localISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes()); }
function dayKey(iso){ return iso.slice(0,10); }
function fmtDay(k){
  const d = new Date(k+"T12:00");
  const wd = ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()];
  const today = dayKey(localISO(new Date()));
  const yest = dayKey(localISO(new Date(Date.now()-864e5)));
  let s = wd+", "+pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear();
  if(k===today) s = "Heute · "+s; else if(k===yest) s = "Gestern · "+s;
  return s;
}
function fmtTime(iso){ return iso.slice(11,16)+" Uhr"; }

/* ---------- Liste ---------- */
function render(){
  const list = document.getElementById("list");
  const name = DATA.settings.name;
  document.getElementById("subline").textContent =
    (name ? "für "+name+" · " : "") + "Ernährungs- & Symptomprotokoll";
  if(!DATA.entries.length){
    list.innerHTML = '<div class="empty"><span class="emo">🌱</span>Noch keine Einträge.<br>Tippe oben auf eine Kategorie, um zu starten.</div>';
    return;
  }
  const sorted = [...DATA.entries].sort((a,b)=> b.time.localeCompare(a.time));
  const days = {};
  for(const e of sorted){ (days[dayKey(e.time)] ||= []).push(e); }
  let html = "";
  for(const k of Object.keys(days)){
    const vom = days[k].filter(e=>e.type==="erbrechen").length;
    html += '<div class="day"><div class="dayhead"><h2>'+fmtDay(k)+'</h2>'+
      (vom? '<div class="daybadges"><span class="badge">'+vom+'× erbrochen</span></div>':'')+
      '</div><div class="timeline">';
    for(const e of days[k]){
      const t = TYPES[e.type];
      html += '<div class="entry" style="--dot:'+t.color+'" onclick="openForm(\''+e.type+'\',\''+e.id+'\')">'+
        '<div class="top"><span class="kind">'+t.emo+' '+t.label+(e.chips&&e.chips.length? ' · '+esc(e.chips.join(", ")):'')+'</span>'+
        '<span class="time">'+fmtTime(e.time)+'</span></div>'+
        (e.main? '<div class="body">'+esc(e.main)+'</div>':'')+
        (e.note? '<div class="note">'+esc(e.note)+'</div>':'')+
      '</div>';
    }
    html += '</div></div>';
  }
  list.innerHTML = html;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------- Formular ---------- */
function openForm(type, id){
  curType = type; editId = id || null; selChips = [];
  const t = TYPES[type];
  document.getElementById("formTitle").textContent = t.emo+" "+t.label+(id? " bearbeiten":"");
  document.getElementById("chipLabel").textContent = t.chipLabel;
  document.getElementById("mainLabel").textContent = t.mainLabel;
  document.getElementById("mainHint").textContent = t.hint;
  let e = null;
  if(id){ e = DATA.entries.find(x=>x.id===id); selChips = [...(e.chips||[])]; }
  document.getElementById("fTime").value = e? e.time : localISO(new Date());
  document.getElementById("fMain").value = e? e.main : "";
  document.getElementById("fNote").value = e? e.note : "";
  document.getElementById("deleteBtn").style.display = id? "block":"none";
  const box = document.getElementById("chipBox");
  box.innerHTML = "";
  for(const c of t.chips){
    const b = document.createElement("button");
    b.className = "chip"+(selChips.includes(c)?" on":"");
    b.textContent = c;
    b.onclick = ()=>{
      if(t.multiChip){
        selChips.includes(c)? selChips.splice(selChips.indexOf(c),1) : selChips.push(c);
      }else{
        selChips = selChips.includes(c)? [] : [c];
      }
      [...box.children].forEach(x=> x.classList.toggle("on", selChips.includes(x.textContent)));
    };
    box.appendChild(b);
  }
  document.getElementById("formOverlay").classList.add("open");
}
function closeForm(){ document.getElementById("formOverlay").classList.remove("open"); }
async function saveEntry(){
  const time = document.getElementById("fTime").value;
  if(!time){ alert("Bitte Datum und Uhrzeit angeben."); return; }
  const obj = {
    id: editId || uid(), type: curType, time,
    chips: [...selChips],
    main: document.getElementById("fMain").value.trim(),
    note: document.getElementById("fNote").value.trim()
  };
  if(editId){
    const i = DATA.entries.findIndex(x=>x.id===editId);
    DATA.entries[i] = obj;
  } else DATA.entries.push(obj);
  await persist(); closeForm(); render(); toast("Gespeichert ✓");
}
async function deleteEntry(){
  if(!confirm("Diesen Eintrag wirklich löschen?")) return;
  DATA.entries = DATA.entries.filter(x=>x.id!==editId);
  await persist(); closeForm(); render(); toast("Gelöscht");
}

/* ---------- Einstellungen ---------- */
document.getElementById("settingsBtn").onclick = ()=>{
  document.getElementById("sName").value = DATA.settings.name||"";
  document.getElementById("sBirth").value = DATA.settings.birth||"";
  document.getElementById("sExtra").value = DATA.settings.extra||"";
  document.getElementById("settingsOverlay").classList.add("open");
};
function closeOverlay(id){ document.getElementById(id).classList.remove("open"); }
async function saveSettings(){
  DATA.settings = {
    name: document.getElementById("sName").value.trim(),
    birth: document.getElementById("sBirth").value,
    extra: document.getElementById("sExtra").value.trim()
  };
  await persist(); closeOverlay("settingsOverlay"); render(); toast("Gespeichert ✓");
}

/* ---------- Export ---------- */
function openExport(){
  if(!DATA.entries.length){ alert("Noch keine Einträge zum Exportieren."); return; }
  setRange(7);
  document.getElementById("exportOverlay").classList.add("open");
}
function setRange(days){
  const to = new Date();
  document.getElementById("expTo").value = dayKey(localISO(to));
  if(days===0){
    const min = DATA.entries.reduce((m,e)=> e.time<m? e.time:m, DATA.entries[0].time);
    document.getElementById("expFrom").value = dayKey(min);
  }else{
    document.getElementById("expFrom").value = dayKey(localISO(new Date(Date.now()-(days-1)*864e5)));
  }
}
document.getElementById("rangeChips").addEventListener("click", ev=>{
  const b = ev.target.closest(".chip"); if(!b) return;
  [...document.getElementById("rangeChips").children].forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); setRange(parseInt(b.dataset.d));
});

function makePDF(){
  const from = document.getElementById("expFrom").value;
  const to = document.getElementById("expTo").value;
  if(!from || !to || from>to){ alert("Bitte gültigen Zeitraum wählen."); return; }
  const entries = DATA.entries
    .filter(e=> dayKey(e.time)>=from && dayKey(e.time)<=to)
    .sort((a,b)=> a.time.localeCompare(b.time));
  if(!entries.length){ alert("Im gewählten Zeitraum gibt es keine Einträge."); return; }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const s = DATA.settings;
  const fmtD = d => d.split("-").reverse().join(".");
  let y = 18;

  doc.setFont("helvetica","bold"); doc.setFontSize(16);
  doc.text("Ernährungs- und Symptomtagebuch", 14, y); y += 7;
  doc.setFontSize(10.5); doc.setFont("helvetica","normal");
  let info = [];
  if(s.name) info.push("Kind: "+s.name);
  if(s.birth) info.push("geb. "+fmtD(s.birth));
  info.push("Zeitraum: "+fmtD(from)+" – "+fmtD(to));
  doc.text(info.join("   ·   "), 14, y); y += 5.5;
  doc.setTextColor(110);
  doc.text("Erstellt am "+fmtD(dayKey(localISO(new Date())))+" · geführt von den Eltern", 14, y);
  doc.setTextColor(0); y += 7;

  if(s.extra){
    doc.setFont("helvetica","bold"); doc.text("Bekannte Befunde:", 14, y);
    doc.setFont("helvetica","normal");
    const lines = doc.splitTextToSize(s.extra, 145);
    doc.text(lines, 52, y); y += lines.length*5 + 3;
  }

  // Zusammenfassung
  const nVom = entries.filter(e=>e.type==="erbrechen").length;
  const nDays = new Set(entries.filter(e=>e.type==="erbrechen").map(e=>dayKey(e.time))).size;
  doc.setFillColor(243,247,246);
  doc.roundedRect(14, y, 182, 10, 2, 2, "F");
  doc.setFont("helvetica","bold");
  doc.text("Zusammenfassung: "+nVom+" Erbrechens-Episode"+(nVom===1?"":"n")+" an "+nDays+" Tag"+(nDays===1?"":"en")+" im Zeitraum", 18, y+6.5);
  doc.setFont("helvetica","normal");
  y += 16;

  // Tabellen pro Tag
  const days = {};
  for(const e of entries){ (days[dayKey(e.time)] ||= []).push(e); }
  for(const k of Object.keys(days)){
    const rows = days[k].map(e=>{
      const t = TYPES[e.type];
      let det = "";
      if(e.chips && e.chips.length) det += e.chips.join(", ");
      if(e.main) det += (det? " – ":"") + e.main;
      if(e.note) det += (det? "\n":"") + "Notiz: " + e.note;
      return [e.time.slice(11,16), t.label, det || "—"];
    });
    doc.autoTable({
      startY: y,
      head: [[{content: fmtDay(k).replace("Heute · ","").replace("Gestern · ",""), colSpan:3,
               styles:{fillColor:[46,125,116], fontStyle:"bold"}}],
             ["Uhrzeit","Kategorie","Details"]],
      body: rows,
      margin:{left:14, right:14},
      styles:{font:"helvetica", fontSize:9.5, cellPadding:2.2, valign:"top"},
      headStyles:{fillColor:[30,58,58], textColor:255},
      columnStyles:{0:{cellWidth:18}, 1:{cellWidth:42}},
      alternateRowStyles:{fillColor:[247,250,249]},
      didParseCell: d=>{
        if(d.section==="body" && d.column.index===1){
          const e = days[k][d.row.index];
          if(e.type==="erbrechen"){ d.cell.styles.textColor=[200,60,50]; d.cell.styles.fontStyle="bold"; }
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;
    if(y > 265){ doc.addPage(); y = 18; }
  }

  // Fußzeile mit Seitenzahlen
  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setFontSize(8.5); doc.setTextColor(130);
    doc.text("Bauchtagebuch"+(s.name? " – "+s.name:"")+" · Seite "+i+" von "+pages, 105, 290, {align:"center"});
  }

  const fname = "Tagebuch_"+(s.name||"Kind").replace(/\s+/g,"_")+"_"+from+"_bis_"+to+".pdf";
  doc.save(fname);
  closeOverlay("exportOverlay");
  toast("PDF erstellt ✓");
}

/* Overlay per Klick auf Hintergrund schließen */
document.querySelectorAll(".overlay").forEach(o=>{
  o.addEventListener("click", ev=>{ if(ev.target===o) o.classList.remove("open"); });
});

load();
</script>
</body>
</html>
